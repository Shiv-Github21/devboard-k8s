apiVersion: v1
kind: Service
metadata:
  name: backend #backend service name beacuse it is hardcoded in the frontend code to call the backend service
  namespace: devboard
spec:
  selector:
    app: devboard-be
  type: clusterIP
  ports:
    - protocol: TCP
      port: 8080 #backend service port https//backend:8080
      targetPort: 8080 #backend container port
      

